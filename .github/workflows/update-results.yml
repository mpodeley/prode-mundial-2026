name: Update Mundial 2026 results

on:
  schedule:
    # Cada hora desde el 10-jun hasta el 20-jul (UTC). Ajustable.
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Cortar costos: solo correr en el rango del torneo
    if: github.event_name == 'workflow_dispatch' || (github.run_started_at >= '2026-06-10T00:00:00Z' && github.run_started_at <= '2026-07-20T23:59:59Z')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install firebase-admin
        run: npm init -y && npm install firebase-admin@13

      - name: Fetch and sync results
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node scripts/fetch-results.mjs
