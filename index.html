<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prode Pluspetrol — Mundial 2026</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter','system-ui','sans-serif'] } } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/style.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-emerald-900 via-emerald-800 to-teal-900 text-white font-sans">
  <main class="min-h-screen flex flex-col items-center justify-center px-4 py-12" x-data="loginPage()">

    <header class="text-center mb-10">
      <div class="text-6xl mb-3">⚽</div>
      <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight">Prode Pluspetrol</h1>
      <p class="text-emerald-200 mt-2 text-lg">Mundial FIFA 2026 · 🇺🇸 🇨🇦 🇲🇽</p>
      <div class="mt-6 inline-block bg-white/10 backdrop-blur rounded-xl px-5 py-3" x-show="countdown">
        <p class="text-xs uppercase text-emerald-200">Faltan</p>
        <p class="text-2xl font-bold tabular-nums" x-text="countdown"></p>
      </div>
    </header>

    <section class="w-full max-w-sm bg-white/10 backdrop-blur rounded-2xl shadow-2xl p-6 sm:p-8 border border-white/20">
      <div class="flex gap-2 mb-6 bg-white/10 rounded-lg p-1">
        <button @click="mode='login'" :class="mode==='login' ? 'bg-white text-emerald-900' : 'text-white/80'"
                class="flex-1 py-2 rounded-md font-semibold transition">Entrar</button>
        <button @click="mode='register'" :class="mode==='register' ? 'bg-white text-emerald-900' : 'text-white/80'"
                class="flex-1 py-2 rounded-md font-semibold transition">Registrarme</button>
      </div>

      <form @submit.prevent="submit" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-emerald-100 mb-1">Nickname</label>
          <input x-model="nick" type="text" required maxlength="20" autocomplete="username"
                 placeholder="ej: marcos"
                 class="w-full px-3 py-2.5 rounded-lg bg-white/90 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-amber-400" />
          <p class="text-xs text-emerald-200/70 mt-1">Solo letras, números y guiones bajos. Se convierte a minúsculas.</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-emerald-100 mb-1">PIN</label>
          <input x-model="pin" type="password" required minlength="4" maxlength="12" inputmode="numeric"
                 autocomplete="current-password"
                 placeholder="mínimo 4 caracteres"
                 class="w-full px-3 py-2.5 rounded-lg bg-white/90 text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-amber-400" />
        </div>

        <p x-show="error" x-text="error" class="text-sm text-red-200 bg-red-900/40 rounded-lg p-2"></p>

        <button type="submit" :disabled="busy"
                class="w-full bg-amber-400 hover:bg-amber-300 disabled:opacity-50 text-emerald-950 font-bold py-3 rounded-lg transition">
          <span x-show="!busy" x-text="mode==='login' ? 'Entrar' : 'Crear cuenta'"></span>
          <span x-show="busy">…</span>
        </button>
      </form>

      <p class="text-xs text-emerald-200/70 mt-6 text-center">
        Si te olvidás el PIN, pedile a un admin que te reseteé la cuenta.
      </p>
    </section>

    <footer class="mt-10 text-center text-emerald-200/60 text-xs">
      Hecho para los compañeros de Pluspetrol · Datos en Firebase · Hosting en GitHub Pages
    </footer>
  </main>

  <script type="module" src="./assets/auth.js"></script>
</body>
</html>
